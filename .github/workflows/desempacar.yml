name: Desempacar rqsim.zip

on:
  push:
    paths:
      - rqsim.zip
      - .github/workflows/desempacar.yml

permissions:
  contents: write

jobs:
  desempacar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir y publicar
        run: |
          test -f rqsim.zip || { echo "No hay rqsim.zip"; exit 0; }
          unzip -q rqsim.zip -d /tmp/z
          rm -rf /tmp/z/rqsim/.github
          cp -r /tmp/z/rqsim/. .
          git rm -q rqsim.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "rqsim v0.1: código desde rqsim.zip"
          git push
